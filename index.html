<style>
/* Layout: one narrow column that also works as a small desktop widget; weapon picker, level control, then the 5 attachment slots */
:root{
  --bg:#eef0f2; --panel:#ffffff; --line:#d5dade; --ink:#1b2128; --muted:#5d6872;
  --accent:#d9620b; --accent-ink:#ffffff; --ok:#1f7a4d; --swap:#9a6b00; --extra:#3d5f8a; --lock:#8a939b;
  --ok-bg:#e3f2ea; --swap-bg:#fbf0d6; --extra-bg:#e3ebf5;
  --display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14191f; --panel:#1c232b; --line:#2d3740; --ink:#e7ebee; --muted:#9aa6b0;
  --accent:#ff8a2b; --accent-ink:#1a1206; --ok:#5ccf93; --swap:#e7b64a; --extra:#8db3e6; --lock:#6c7781;
  --ok-bg:#163326; --swap-bg:#3a2f12; --extra-bg:#1b2a3d; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14191f; --panel:#1c232b; --line:#2d3740; --ink:#e7ebee; --muted:#9aa6b0;
  --accent:#ff8a2b; --accent-ink:#1a1206; --ok:#5ccf93; --swap:#e7b64a; --extra:#8db3e6; --lock:#6c7781;
  --ok-bg:#163326; --swap-bg:#3a2f12; --extra-bg:#1b2a3d; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.7rem;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--accent)}
.stamp{font-family:var(--mono);font-size:.75rem;color:var(--muted);text-align:right}
.label{font-family:var(--display);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}

.combo{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.combo b{font-family:var(--display);font-size:1.05rem}

.picker{display:flex;flex-direction:column;gap:8px}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group .label{width:100%}
.chip{font:600 .9rem var(--display);letter-spacing:.03em;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:7px 12px;border-radius:4px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip small{font:500 .68rem var(--mono);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed="true"] small{color:var(--accent-ink);opacity:.8}
.chip:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px}
.whead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.whead h2{font-family:var(--display);font-size:1.5rem;margin:0;line-height:1.1}
.whead .sub{color:var(--muted);font-size:.85rem}
.tier{font:700 .75rem var(--display);letter-spacing:.1em;padding:4px 8px;border-radius:3px;border:1px solid currentColor}
.tier.meta{color:var(--accent)} .tier.a{color:var(--extra)}
.note{font-size:.82rem;color:var(--swap);background:var(--swap-bg);padding:6px 10px;border-radius:4px}

.level{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.level .ctl{display:flex;align-items:center;gap:4px}
.level button{width:34px;height:34px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;font:700 1.1rem var(--mono);cursor:pointer}
.level input[type=number]{width:58px;height:34px;text-align:center;font:600 1.1rem var(--mono);border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.level input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.lvl-head{display:flex;justify-content:space-between;align-items:baseline}
.count{font-family:var(--mono);font-size:.8rem;color:var(--muted)}

.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:5px;border:1px solid var(--line)}
.slot .s{font:600 .72rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.slot .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.slot .n em{display:block;font-style:normal;font-weight:400;font-size:.76rem;color:var(--muted)}
.slot .lv{font:500 .75rem var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
.tag{font:700 .64rem var(--display);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}
.t-meta{background:var(--ok-bg);color:var(--ok)} .t-swap{background:var(--swap-bg);color:var(--swap)} .t-extra{background:var(--extra-bg);color:var(--extra)}
.empty{padding:12px;border:1px dashed var(--line);border-radius:5px;color:var(--muted);font-size:.88rem}

.next{display:flex;flex-direction:column;gap:6px}
.next ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.next li{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:4px 0;border-bottom:1px solid var(--line)}
.next li:last-child{border-bottom:0}
.next li span:last-child{font-family:var(--mono);color:var(--lock);white-space:nowrap}
.done{color:var(--ok);font-weight:600;font-size:.9rem}

.status{font-weight:600;color:var(--accent)} .status.ok{color:var(--ok)} .status.old{color:var(--swap)}
.codebtn{font:600 .8rem var(--display);letter-spacing:.04em;text-decoration:none;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:6px 10px;align-self:flex-start}
.combo{gap:8px}
.combo-picks{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.pick{flex:1 1 140px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:10px 14px;cursor:pointer;text-align:left}
.pick-role{font:600 .68rem var(--display);text-transform:uppercase;letter-spacing:.12em;opacity:.85}
.pick-name{font:700 1.3rem var(--display);line-height:1.1}
.plus{align-self:center;font:700 1.4rem var(--display);color:var(--accent)}
.chip .rk{font:700 .78rem var(--mono);color:var(--muted)}
.chip.best{border-color:var(--accent);border-width:2px}
.chip .star{font:700 .6rem var(--display);letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);padding:2px 5px;border-radius:3px}
.chip[aria-pressed="true"] .rk{color:var(--accent-ink)}
.chip[aria-pressed="true"] .star{background:var(--accent-ink);color:var(--accent)}
.fav{display:flex;flex-direction:column;gap:8px}
.fav-form{display:flex;gap:6px;flex-wrap:wrap}
.fav-form input{flex:1 1 200px;min-width:0;height:38px;padding:0 10px;font:500 .95rem var(--body);border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.fav-add{height:38px;padding:0 14px;font:600 .9rem var(--display);border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:4px;cursor:pointer}
.fav-chips{display:flex;flex-wrap:wrap;gap:6px}
.favchip{display:flex;align-items:stretch}
.favchip .chip{border-top-right-radius:0;border-bottom-right-radius:0}
.fav-del{border:1px solid var(--line);border-left:0;background:var(--panel);color:var(--muted);border-radius:0 4px 4px 0;padding:0 9px;cursor:pointer;font-size:1rem}
.bug{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bug h3{font:700 1.05rem var(--display);margin:0}
.bug p{margin:0}
.bug-form{display:flex;flex-direction:column;gap:8px}
.bug-form input,.bug-form textarea{width:100%;box-sizing:border-box;padding:8px 10px;font:500 .95rem var(--body);border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);resize:vertical}
.bug-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
footer{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
footer a{color:var(--muted)}
@media (max-width:420px){ .slot{grid-template-columns:1fr auto} .slot .s{grid-column:1/-1} .level{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Resurgence <span>Meta</span></h1>
    <div class="stamp"><span id="stamp"></span><br><span id="status" class="status">Lade aktuelle Meta …</span></div>
  </header>

  <div class="combo" id="combo"></div>

  <section class="fav" id="fav" aria-label="Lieblingswaffen"></section>

  <nav class="picker" id="picker" aria-label="Waffe wählen"></nav>

  <section class="card" id="card" aria-live="polite"></section>

  <section class="bug" aria-labelledby="bug-h">
    <h3 id="bug-h">Fehler gefunden?</h3>
    <p class="count">Schreib kurz, was nicht stimmt, z. B. ein falscher Aufsatz oder ein Knopf, der nicht geht. Die Meldung geht an Matti und wird automatisch geprüft.</p>
    <form id="bug-form" class="bug-form">
      <input id="bug-name" maxlength="40" placeholder="Dein Name (freiwillig)" autocomplete="off" aria-label="Dein Name">
      <textarea id="bug-text" maxlength="500" rows="3" placeholder="Was ist falsch?" aria-label="Fehlerbeschreibung" required></textarea>
      <div class="bug-row"><button type="submit" class="fav-add" id="bug-send">Fehler melden</button><span class="count" id="bug-msg" role="status"></span></div>
    </form>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/MKRAFT3D/warzone-meta/main/meta.json';
const store0 = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
async function loadData(){
  const st = document.getElementById('status');
  try{
    const r = await fetch(DATA_URL + '?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    if(!d.weapons || !d.weapons.length) throw new Error('leer');
    if(!d.library){ try{ d.library = JSON.parse(document.getElementById('fallback-data').textContent).library || []; }catch(e){ d.library = []; } }
    store0.set('rm-cache', d);
    st.textContent = 'Gerade aktualisiert ✓'; st.className='status ok';
    return d;
  }catch(e){
    const c = store0.get('rm-cache');
    st.className='status old';
    if(c){ st.textContent = 'Kein Internet – letzter Stand'; return c; }
    st.textContent = 'Kein Internet – eingebauter Stand';
    return JSON.parse(document.getElementById('fallback-data').textContent);
  }
}
loadData().then(function(DATA){
  const MAX_LVL = 80, SLOTS = 5;
  const store = {
    get(k,d){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  const LIB = (DATA.library||[]).filter(l=>!DATA.weapons.some(w=>w.id===l.id));
  const ALL = DATA.weapons.concat(LIB);
  const byId = Object.fromEntries(ALL.map(w=>[w.id,w]));
  let favs = (store.get('rm-favs', [])||[]).filter(id=>byId[id]);
  let current = byId[store.get('rm-weapon','')] ? store.get('rm-weapon','') : DATA.combo.long;
  const levels = store.get('rm-levels', {});
  const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // Pick the best 5 attachments the weapon has unlocked at this level.
  function build(w, L){
    const out = [], used = new Set();
    for(const m of w.meta){
      if(m.lvl!=null && m.lvl <= L){ out.push({...m, kind:'meta'}); used.add(m.slot); continue; }
      const alt = (w.alts||[]).find(a => a.slot===m.slot && a.lvl!=null && a.lvl<=L);
      if(alt){ out.push({...alt, kind:'swap', for:m}); used.add(m.slot); }
    }
    for(const e of (w.extras||[])){
      if(out.length >= SLOTS) break;
      if(e.lvl!=null && e.lvl <= L && !used.has(e.slot)){ out.push({...e, kind:'extra'}); used.add(e.slot); }
    }
    const locked = w.meta.filter(m => m.lvl==null || m.lvl > L).sort((a,b)=>(a.lvl==null?999:a.lvl)-(b.lvl==null?999:b.lvl));
    return {out, locked};
  }

  document.getElementById('stamp').innerHTML =
    esc(DATA.season)+'<br>Daten vom '+esc(DATA.dataDate);

  const cl = byId[DATA.combo.long], cc = byId[DATA.combo.close];
  document.getElementById('combo').innerHTML =
    '<span class="label">Die Meta – nimm diese zwei</span>'+
    '<div class="combo-picks">'+
      '<button type="button" class="pick" data-id="'+cl.id+'"><span class="pick-role">Hauptwaffe</span><span class="pick-name">'+esc(cl.name)+'</span></button>'+
      '<span class="plus">+</span>'+
      '<button type="button" class="pick" data-id="'+cc.id+'"><span class="pick-role">Zweitwaffe</span><span class="pick-name">'+esc(cc.name)+'</span></button>'+
    '</div><span class="count">'+esc(DATA.combo.why)+' Tipp: Antippen zeigt den Build.</span>';
  document.getElementById('combo').addEventListener('click', e=>{
    const b = e.target.closest('.pick'); if(!b) return;
    current = b.dataset.id; store.set('rm-weapon', current); render();
    document.getElementById('card').scrollIntoView({behavior:'smooth', block:'start'});
  });

  const favEl = document.getElementById('fav');
  const byName = n => ALL.find(w=>w.name.toLowerCase()===String(n).trim().toLowerCase());
  favEl.innerHTML =
    '<span class="label">Deine Lieblingswaffen</span>'+
    '<form class="fav-form" id="fav-form"><input id="fav-input" list="fav-list" placeholder="Waffe eintippen, z. B. Kastov 762" autocomplete="off" aria-label="Lieblingswaffe suchen">'+
    '<datalist id="fav-list">'+ALL.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(w=>'<option value="'+esc(w.name)+'"></option>').join('')+'</datalist>'+
    '<button type="submit" class="fav-add">Hinzufügen</button></form>'+
    '<div class="fav-chips" id="fav-chips"></div><span class="count" id="fav-msg"></span>';
  function drawFavs(){
    const box = document.getElementById('fav-chips');
    box.innerHTML = favs.length ? favs.map(id=>'<span class="favchip"><button type="button" class="chip" data-id="'+id+'" aria-pressed="false">★ '+esc(byId[id].name)+' <small>Lv '+(levels[id]||1)+'</small></button><button type="button" class="fav-del" data-del="'+id+'" aria-label="'+esc(byId[id].name)+' entfernen">×</button></span>').join('')
      : '<span class="count">Noch keine. Tipp oben deine Waffe ein und klick auf Hinzufügen.</span>';
  }
  document.getElementById('fav-form').addEventListener('submit', e=>{
    e.preventDefault();
    const inp = document.getElementById('fav-input'), msg = document.getElementById('fav-msg');
    const w = byName(inp.value);
    if(!w){ msg.textContent = 'Diese Waffe kenne ich nicht. Wähl am besten einen Namen aus der Vorschlagsliste.'; return; }
    if(!favs.includes(w.id)){ favs.push(w.id); store.set('rm-favs', favs); }
    msg.textContent = ''; inp.value = '';
    current = w.id; store.set('rm-weapon', current); drawFavs(); render();
  });
  favEl.addEventListener('click', e=>{
    const del = e.target.closest('.fav-del');
    if(del){ favs = favs.filter(id=>id!==del.dataset.del); store.set('rm-favs', favs); drawFavs(); render(); return; }
    const b = e.target.closest('.chip'); if(!b) return;
    current = b.dataset.id; store.set('rm-weapon', current); render();
  });
  drawFavs();

  const picker = document.getElementById('picker');
  const groups = [['long','Langstrecke · Hauptwaffe'],['close','Nahkampf · Zweitwaffe']];
  picker.innerHTML = groups.map(([r,label]) =>
    '<div class="group"><span class="label">'+label+' · nach Stärke sortiert</span>'+
    DATA.weapons.filter(w=>w.range===r).map(w=>({w, n: parseInt((String(w.rank).match(/\d+/)||[99])[0],10)})).sort((a,b)=>a.n-b.n).map(({w,n},i) =>
      '<button class="chip'+(i===0?' best':'')+'" type="button" id="chip-'+w.id+'" data-id="'+w.id+'" aria-pressed="false">'+
      '<span class="rk">#'+(i+1)+'</span>'+esc(w.name)+(i===0?'<span class="star">BESTE WAHL</span>':'')+
      ' <small>Lv '+(levels[w.id]||1)+'</small></button>').join('')+'</div>').join('');
  picker.addEventListener('click', e=>{
    const b = e.target.closest('.chip'); if(!b) return;
    current = b.dataset.id; store.set('rm-weapon', current); render();
  });

  const card = document.getElementById('card');
  function setLevel(v){
    v = Math.max(1, Math.min(MAX_LVL, parseInt(v,10)||1));
    levels[current] = v; store.set('rm-levels', levels);
    render(true);
  }

  function render(keepFocus){
    const w = byId[current], L = levels[current] || 1;
    document.querySelectorAll('#picker .chip, #fav .chip').forEach(c=>{
      c.setAttribute('aria-pressed', c.dataset.id===current ? 'true':'false');
      c.querySelector('small').textContent = 'Lv '+(levels[c.dataset.id]||1);
    });
    if(!w.meta.length){
      card.innerHTML = '<div class="whead"><div><h2>'+esc(w.name)+'</h2><div class="sub">'+esc(w.type)+(favs.includes(w.id)?' · ★ Lieblingswaffe':'')+'</div></div></div>'+
        '<div class="note">Für diese Waffe habe ich noch keinen geprüften Build. Er kommt mit dem nächsten Update (täglich früh morgens). Öffne die Datei dann einfach nochmal.</div>'+
        '<a class="codebtn" href="'+esc(w.codeUrl||'https://wzhub.gg/loadouts')+'" target="_blank" rel="noopener">Build und Code im Netz ansehen ↗</a>';
      return;
    }
    const {out, locked} = build(w, L);
    const tierCls = w.tier==='META' ? 'meta' : 'a';
    const slotsHtml = out.length ? '<ul class="slots">'+out.map(a=>{
      const tag = a.kind==='meta' ? '<span class="tag t-meta">Meta</span>'
        : a.kind==='swap' ? '<span class="tag t-swap">Ersatz</span>'
        : '<span class="tag t-extra">Füller</span>';
      const sub = a.lvl==null ? '<em>Freischalt-Level unbekannt, bitte im Spiel prüfen</em>' : a.kind==='swap' ? '<em>bis '+esc(a.for.name)+' frei ist (Level '+a.for.lvl+')</em>'
        : a.kind==='extra' ? '<em>füllt einen freien Platz, bis mehr Meta-Teile frei sind</em>' : '';
      return '<li class="slot"><span class="s">'+esc(a.slot)+'</span><span class="n">'+esc(a.name)+tag+sub+'</span><span class="lv">'+(a.lvl==null?'Lv ?':'ab Lv '+a.lvl)+'</span></li>';
    }).join('')+'</ul>'
      : '<div class="empty">Auf Level '+L+' ist noch nichts Brauchbares frei. Spiel die Waffe ein paar Runden ohne Aufsätze, das erste Teil kommt bald.</div>';

    const nextHtml = locked.length
      ? '<div class="next"><span class="label">Als Nächstes freischalten</span><ul>'+
        locked.map(m=>'<li><span>'+esc(m.name)+' <span class="count">· '+esc(m.slot)+'</span></span><span>'+(m.lvl==null?'Level unbekannt – im Spiel prüfen':'Lv '+m.lvl+' · noch '+(m.lvl-L))+'</span></li>').join('')+'</ul></div>'
      : '<div class="done">Alle Meta-Aufsätze sind frei. Das ist der volle Build.</div>';

    const metaCount = out.filter(a=>a.kind==='meta').length;
    card.innerHTML =
      '<div class="whead"><div><h2>'+esc(w.name)+'</h2><div class="sub">'+esc(w.type)+(w.rank?' · '+esc(w.rank)+' in Wiederauferstehung':'')+(favs.includes(w.id)?' · ★ Lieblingswaffe':'')+'</div><div class="sub">'+esc(w.src||'')+'</div></div>'+(w.tier?'<span class="tier '+tierCls+'">'+(w.tier==='META'?'META':esc(w.tier)+'-TIER')+'</span>':'<span class="tier a">Nicht Meta</span>')+'</div>'+
      (w.note ? '<div class="note">'+esc(w.note)+'</div>' : '')+
      '<div><div class="lvl-head"><label class="label" for="lvl-num">Dein Waffenlevel</label><span class="count">'+metaCount+' von '+w.meta.length+' Meta-Teilen frei</span></div>'+
      '<div class="level"><div class="ctl"><button type="button" id="lvl-dec" aria-label="Level runter">−</button><input type="number" id="lvl-num" min="1" max="'+MAX_LVL+'" value="'+L+'"><button type="button" id="lvl-inc" aria-label="Level hoch">+</button></div>'+
      '<input type="range" id="lvl-range" min="1" max="'+MAX_LVL+'" value="'+L+'" aria-label="Waffenlevel Regler"><span class="count">max '+MAX_LVL+'</span></div></div>'+
      '<div><span class="label">So baust du sie jetzt</span></div>'+slotsHtml+nextHtml+'<a class="codebtn" href="'+esc(w.codeUrl||'https://wzhub.gg/loadouts')+'" target="_blank" rel="noopener">Waffencode holen ↗</a>';

    const num = card.querySelector('#lvl-num'), rng = card.querySelector('#lvl-range');
    card.querySelector('#lvl-dec').onclick = ()=>setLevel(L-1);
    card.querySelector('#lvl-inc').onclick = ()=>setLevel(L+1);
    num.onchange = ()=>setLevel(num.value);
    rng.oninput = ()=>{ num.value = rng.value; };
    rng.onchange = ()=>setLevel(rng.value);
    if(keepFocus===true && document.activeElement===document.body){}
  }

  document.getElementById('foot').innerHTML =
    '<span>Quelle: '+DATA.sources.map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.name)+'</a>').join(' · ')+'</span>'+
    '<span>Mittelwert aus mehreren Quellen. Lädt bei jedem Öffnen den neuesten Stand. Zuletzt: '+esc(DATA.updated)+'. Deine Level bleiben in diesem Browser gespeichert.</span>';

  const BUG_HOOK = 'https://hooks.nabu.casa/gAAAAABq75Skexz-_msHhAk5p-3ho_YqENMJkX3hdADLu5EwSRgsUrix4xZwR3v3tcMALqPKE_kb0T6HbiQhngQgu5kqRV9QTodaWxuvFixHYckFI11gUn8SVVDgHPP5zJ-0XUZsf48Zny5HF8uKPmsQJuJf7jckq_06xp0Irm1ZI9_IPFpJqjw=';
  document.getElementById('bug-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const msg = document.getElementById('bug-msg'), btn = document.getElementById('bug-send');
    const text = document.getElementById('bug-text').value.trim();
    const name = document.getElementById('bug-name').value.trim();
    if(text.length < 4){ msg.textContent = 'Bitte schreib ein paar Worte mehr.'; return; }
    const last = store.get('rm-bug-last', 0);
    if(Date.now() - last < 60000){ msg.textContent = 'Bitte warte kurz, bevor du noch einen Fehler meldest.'; return; }
    const w = byId[current];
    const body = new URLSearchParams({ text: text + (w ? ' [Waffe: '+w.name+', Lv '+(levels[current]||1)+']' : ''), name: name });
    btn.disabled = true; msg.textContent = 'Wird gesendet …';
    try{
      await fetch(BUG_HOOK, { method:'POST', mode:'no-cors', body });
      store.set('rm-bug-last', Date.now());
      document.getElementById('bug-text').value = '';
      msg.textContent = 'Danke! Deine Meldung ist angekommen.';
    }catch(err){
      msg.textContent = 'Senden hat nicht geklappt. Bist du online? Versuch es gleich nochmal.';
    }
    btn.disabled = false;
  });

  render();
});
</script>
